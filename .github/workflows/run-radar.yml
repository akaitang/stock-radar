
name: Run ETF Radar

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etf-radar
  cancel-in-progress: false

jobs:
  run-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Analyze 5-minute ETF candles
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python radar_scan.py

      - name: Save radar results
        run: |
          test -f radar.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar.json
          if ! git diff --cached --quiet; then
            git commit -m "Update ETF radar results"
            git push
          else
            echo "No changes to radar.json"
          fi

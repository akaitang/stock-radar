
name: Test Twelve Data Quotes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-quotes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test 5-minute ETF quotes
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python test_quotes.py

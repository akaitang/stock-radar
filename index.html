<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ETF 2X 交易雷達</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#0b1220;color:#e9eef7}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:auto;padding:28px 18px 70px}header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}h1{font-size:clamp(24px,4vw,34px);margin:5px 0}.sub,.muted{color:#a4b1c7}.sub{margin:0}.top{margin:24px 0 18px;padding:14px 18px;background:#152238;border:1px solid #283955;border-radius:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}button{background:#3b82f6;color:white;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}button:hover{background:#2563eb}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:#131e30;border:1px solid #2a3b55;border-radius:18px;padding:22px;min-width:0}.head{display:flex;justify-content:space-between;align-items:center;gap:8px}.ticker{font-size:24px;font-weight:800}.pill{font-size:12px;padding:6px 10px;border-radius:30px;background:#31415b;color:#cbd5e1}.pill.good{background:#164e3a;color:#9ef5c2}.price{font-size:32px;font-weight:800;margin:12px 0 4px}.time{font-size:12px;color:#9aacc4}.numbers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:20px 0}.metric{background:#1b2b42;border-radius:12px;padding:12px;min-width:0}.metric span{display:block;color:#a9b8cb;font-size:12px;margin-bottom:5px}.metric strong{font-size:20px;overflow-wrap:anywhere}.entry strong{color:#7dd3fc}.stop strong{color:#fca5a5}.targets strong{color:#a7f3d0}.indicators{border-top:1px solid #2a3b55;padding-top:14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.indicators div{font-size:12px;color:#a9b8cb}.indicators b{display:block;color:#e5edf8;font-size:15px;margin-top:5px}.warning{margin-top:15px;padding:10px 12px;border-radius:10px;background:#4a321d;color:#ffdfac;font-size:13px}.note{margin-top:24px;font-size:13px;line-height:1.8;color:#a9b8cb}.error{color:#fecaca}.loading{padding:30px;text-align:center;color:#a4b1c7}@media(max-width:720px){main{padding:20px 12px 55px}.grid{grid-template-columns:1fr}.card{padding:17px}.numbers{gap:9px}.metric strong{font-size:18px}}
</style>
</head>
<body><main>
<header><div><p class="sub">STOCK RADAR · 5-MIN CANDLES</p><h1>美股 2X ETF 交易雷達</h1><p class="sub">NVDL · TSLL · MSTU · AMDL</p></div><button id="refresh" type="button">重新讀取資料</button></header>
<section class="top"><div><strong id="health">正在載入資料…</strong><div class="muted" id="updated">—</div></div><div class="muted" id="source">資料來源：Twelve Data</div></section>
<section id="cards" class="grid" aria-live="polite"><div class="loading">正在讀取 radar.json…</div></section>
<p class="note">所有進場、停損與目標價皆為程式策略計算的參考值，不構成投資建議，也不會自動下單。資料可能延遲；「候選進場」只表示歷史 K 棒符合條件，不代表現在仍可進場。此頁面不會直接呼叫 Twelve Data API，也不公開 API Key。</p>
</main>
<script>
const $=id=>document.getElementById(id);
const money=n=>typeof n==='number'&&Number.isFinite(n)?'$'+n.toFixed(2):'—';
const num=(n,d=2)=>typeof n==='number'&&Number.isFinite(n)?n.toFixed(d):'—';
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseBarTime(s){if(typeof s!=='string'||!/^\d{4}-\d\d-\d\d \d\d:\d\d$/.test(s))return null;return new Date(s.replace(' ','T')+':00-04:00');}
function ageOfBar(s){if(typeof s!=='string')return null;const match=s.match(/^(\d{4})-(\d\d)-(\d\d) (\d\d):(\d\d)$/);if(!match)return null;const [_,y,m,d,h,mi]=match;const date=new Date(Date.UTC(+y,+m-1,+d,+h,+mi));const etParts=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(date);const obj=Object.fromEntries(etParts.map(x=>[x.type,x.value]));const delta=(Date.UTC(+y,+m-1,+d,+h,+mi)-Date.UTC(+obj.year,+obj.month-1,+obj.day,+obj.hour,+obj.minute))/60000;const utc=new Date(date.getTime()+delta*60000);return (Date.now()-utc.getTime())/60000;}
function card(r){const has=typeof r.close==='number';const age=ageOfBar(r.bar_time_et);const stale=age===null||age>20||age<0;const active=r.signal===true&&!stale;const status=stale?'歷史資料':(r.status||'觀察中');return `<article class="card"><div class="head"><div class="ticker">${escapeHTML(r.symbol)}</div><span class="pill ${active?'good':''}">${escapeHTML(status)}</span></div><div class="price">${money(r.close)}</div><div class="time">K 棒時間（美東）：${escapeHTML(r.bar_time_et||'無資料')}</div>${has?`<div class="numbers"><div class="metric entry"><span>候選進場價</span><strong>${money(r.entry_reference)}</strong></div><div class="metric stop"><span>停損參考價</span><strong>${money(r.stop_reference)}</strong></div><div class="metric targets"><span>第一目標 · 1.5R</span><strong>${money(r.target_1_5R)}</strong></div><div class="metric targets"><span>第二目標 · 2R</span><strong>${money(r.target_2R)}</strong></div></div><div class="indicators"><div>EMA20<b>${num(r.ema20,3)}</b></div><div>VWAP<b>${num(r.vwap,3)}</b></div><div>成交量比率<b>${num(r.volume_ratio)}×</b></div><div>突破價<b>${money(r.breakout)}</b></div><div>ATR14<b>${num(r.atr14,3)}</b></div><div>原始訊號<b>${r.signal===true?'符合':'未符合'}</b></div></div>`:`<p class="error">${escapeHTML(r.error||'資料不足，無法分析')}</p>`}${stale?'<div class="warning">⚠ 行情非近期資料，請勿當作即時進場訊號。</div>':''}</article>`;}
async function load(){ $('health').textContent='正在讀取雷達資料…';try{const res=await fetch('./radar.json?t='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);const data=await res.json();if(!Array.isArray(data.results))throw new Error('radar.json 格式不正確');const generated=new Date(data.generated_at_utc);const valid=!Number.isNaN(generated.getTime());const mins=valid?(Date.now()-generated.getTime())/60000:Infinity;const stale=mins>20||mins<0;$('health').textContent=stale?'⚠ 資料已過期／尚未更新':'● 資料已更新（仍需確認行情延遲）';$('updated').textContent='分析產生時間：'+(valid?generated.toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false})+'（台灣時間）':'未知');$('source').textContent='來源：'+(data.source||'Twelve Data')+' · '+(data.interval||'5min');$('cards').innerHTML=data.results.map(card).join('')||'<div class="loading">沒有分析結果</div>';}catch(e){$('health').textContent='⚠ 無法載入雷達資料';$('updated').textContent='請確認 radar.json 已存在，且 GitHub Pages 已啟用';$('cards').innerHTML='<div class="card error">讀取失敗：'+escapeHTML(e.message)+'</div>';}}
$('refresh').addEventListener('click',load);load();setInterval(load,60000);
</script></body></html>
